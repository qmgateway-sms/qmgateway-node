# CI for the Node.js SDK. Actions are pinned to full commit hashes (the tag is in the comment); Dependabot proposes updates.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]       # keep to releases that still receive security fixes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ matrix.node }}' }
      - run: npm ci --ignore-scripts       # never run dependency install scripts in CI
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      # The shared contract (webhook signatures, retries, pagination), fetched read-only.
      - run: git clone --depth 1 https://github.com/qmgateway-sms/qmgateway-contract.git tests/contract
      - run: npm test
